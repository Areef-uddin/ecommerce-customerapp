include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - lib/core/services/web_auth_web.dart
  errors:
    unused_local_variable: ignore
    unused_import: ignore
    deprecated_member_use: ignore
    unnecessary_underscores: ignore

linter:
  rules:
