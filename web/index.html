<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="customer_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>customer_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Firebase App & Auth SDKs for Web -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Official Razorpay Standard Checkout SDK -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <div id="recaptcha-container"></div>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAT46Y1gGr2IFdbTsoIJ3KolpsA5pHe9S4",
      authDomain: "ecommerce-auth-fcm.firebaseapp.com",
      projectId: "ecommerce-auth-fcm",
      storageBucket: "ecommerce-auth-fcm.firebasestorage.app",
      messagingSenderId: "621377508053",
      appId: "1:621377508053:android:f8125ef320004cde55085c"
    };

    function ensureFirebase() {
      if (typeof firebase !== 'undefined' && !firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
    }
    ensureFirebase();

    // 1. Google Sign-In with Firebase and Google Identity Services dual-fallback
    window.signInWithGoogleFirebase = function() {
      return new Promise((resolve, reject) => {
        try {
          ensureFirebase();

          function tryGoogleIdentityFallback(origError) {
            try {
              if (typeof google !== 'undefined' && google.accounts && google.accounts.oauth2) {
                const client = google.accounts.oauth2.initTokenClient({
                  client_id: '621377508053-1ej88epn67vc08igp0fib1fnletvrjjp.apps.googleusercontent.com',
                  scope: 'email profile openid',
                  callback: (tokenResponse) => {
                    if (tokenResponse && tokenResponse.access_token) {
                      fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                        headers: { Authorization: 'Bearer ' + tokenResponse.access_token }
                      })
                      .then(r => r.json())
                      .then(u => {
                        resolve(JSON.stringify({
                          email: u.email || '',
                          name: u.name || (u.email ? u.email.split('@')[0] : 'Shopper'),
                          avatar: u.picture || 'https://lh3.googleusercontent.com/a/default-user',
                          uid: u.sub || ''
                        }));
                      })
                      .catch(e => reject(e.toString()));
                    } else {
                      reject(origError ? (origError.message || origError) : 'Google Sign-In canceled');
                    }
                  },
                  error_callback: (err) => {
                    reject(err.message || (origError ? origError.message : 'Google Sign-In failed'));
                  }
                });
                client.requestAccessToken({ prompt: 'select_account' });
                return true;
              }
            } catch (_) {}
            return false;
          }

          if (typeof firebase === 'undefined' || !firebase.auth) {
            if (tryGoogleIdentityFallback(null)) return;
            reject('Firebase Auth SDK is still loading. Please reload the page.');
            return;
          }

          const provider = new firebase.auth.GoogleAuthProvider();
          provider.addScope('email');
          provider.addScope('profile');
          firebase.auth().signInWithPopup(provider)
            .then((res) => {
              const u = res.user;
              resolve(JSON.stringify({
                email: u.email || '',
                name: u.displayName || (u.email ? u.email.split('@')[0] : 'Shopper'),
                avatar: u.photoURL || 'https://lh3.googleusercontent.com/a/default-user',
                uid: u.uid
              }));
            })
            .catch((err) => {
              console.warn('Firebase Google Auth error, trying Google Identity Services fallback:', err);
              if (tryGoogleIdentityFallback(err)) {
                return;
              }
              let userMsg = err.message || 'Firebase Google Sign-In failed';
              if (err.code === 'auth/operation-not-allowed') {
                userMsg = 'Please enable Google provider in Firebase Console > Authentication > Sign-in method.';
              } else if (err.code === 'auth/popup-blocked') {
                userMsg = 'Browser popup blocked. Please allow popups for this site.';
              } else if (err.code === 'auth/unauthorized-domain') {
                userMsg = 'Domain localhost is not added in Firebase Console > Authentication > Settings > Authorized domains.';
              }
              reject(userMsg);
            });
        } catch (e) {
          reject(e.toString());
        }
      });
    };

    // 2. Real Firebase Phone Auth SMS OTP
    window.sendFirebasePhoneOtp = function(phoneNumber) {
      return new Promise((resolve, reject) => {
        try {
          ensureFirebase();
          if (typeof firebase === 'undefined' || !firebase.auth) {
            reject('Firebase Auth SDK is not ready');
            return;
          }
          if (!window.recaptchaVerifier) {
            window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
              'size': 'invisible'
            });
          }
          firebase.auth().signInWithPhoneNumber(phoneNumber, window.recaptchaVerifier)
            .then((confirmationResult) => {
              window.phoneConfirmationResult = confirmationResult;
              resolve(JSON.stringify({ success: true, message: 'OTP sent to ' + phoneNumber }));
            })
            .catch((err) => {
              console.error('Firebase Phone Auth send error:', err);
              if (window.recaptchaVerifier) {
                try {
                  window.recaptchaVerifier.render().then(widgetId => grecaptcha.reset(widgetId)).catch(()=>{});
                } catch(_) {}
              }
              reject(err.message || 'Failed to send SMS OTP via Firebase');
            });
        } catch (e) {
          reject(e.toString());
        }
      });
    };

    // 3. Real Firebase Phone Auth OTP Verification
    window.verifyFirebasePhoneOtp = function(code) {
      return new Promise((resolve, reject) => {
        try {
          if (!window.phoneConfirmationResult) {
            reject('No active Firebase phone verification session found.');
            return;
          }
          window.phoneConfirmationResult.confirm(code)
            .then((res) => {
              const u = res.user;
              resolve(JSON.stringify({
                success: true,
                phone: u.phoneNumber || '',
                uid: u.uid
              }));
            })
            .catch((err) => {
              console.error('Firebase Phone Auth verify error:', err);
              reject(err.message || 'Invalid or expired OTP code');
            });
        } catch (e) {
          reject(e.toString());
        }
      });
    };

    // 4. Real Razorpay Standard Checkout Gateway Modal
    window.openRazorpayCheckout = function(optionsJson) {
      return new Promise((resolve, reject) => {
        try {
          if (typeof Razorpay === 'undefined') {
            reject('Razorpay SDK script not loaded. Please check your internet connection.');
            return;
          }
          const opts = JSON.parse(optionsJson);
          opts.handler = function(response) {
            resolve(JSON.stringify({
              success: true,
              razorpay_payment_id: response.razorpay_payment_id,
              razorpay_order_id: response.razorpay_order_id,
              razorpay_signature: response.razorpay_signature
            }));
          };
          opts.modal = {
            ondismiss: function() {
              reject('Payment window closed by user');
            }
          };
          const rzp = new Razorpay(opts);
          rzp.on('payment.failed', function(resp) {
            console.error('Razorpay payment failed:', resp);
            reject((resp.error && resp.error.description) ? resp.error.description : 'Payment failed');
          });
          rzp.open();
        } catch (e) {
          reject(e.toString());
        }
      });
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
