<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="customer_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>customer_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Firebase App & Auth SDKs for Web -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Official Razorpay Standard Checkout SDK -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <div id="recaptcha-container"></div>
  <script>
    // Ensure localhost domain is used so Firebase Auth origin validation passes
    if (window.location.hostname === '127.0.0.1') {
      try {
        window.location.replace(window.location.href.replace('://127.0.0.1:', '://localhost:'));
      } catch (_) {}
    }

    const firebaseConfig = {
      apiKey: "AIzaSyAT46Y1gGr2IFdbTsoIJ3KolpsA5pHe9S4",
      authDomain: "ecommerce-auth-fcm.firebaseapp.com",
      projectId: "ecommerce-auth-fcm",
      storageBucket: "ecommerce-auth-fcm.firebasestorage.app",
      messagingSenderId: "621377508053",
      appId: "1:621377508053:android:f8125ef320004cde55085c"
    };

    function ensureFirebase() {
      if (typeof firebase !== 'undefined' && !firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
    }
    ensureFirebase();

    // 1. Real Firebase Google Sign-In popup
    window.signInWithGoogleFirebase = function() {
      return new Promise((resolve, reject) => {
        try {
          ensureFirebase();

          if (typeof firebase === 'undefined' || !firebase.auth) {
            reject('Firebase Auth SDK is still loading. Please reload the page.');
            return;
          }

          const provider = new firebase.auth.GoogleAuthProvider();
          provider.addScope('email');
          provider.addScope('profile');
          provider.setCustomParameters({ prompt: 'select_account' });

          firebase.auth().signInWithPopup(provider)
            .then((res) => {
              const u = res.user;
              resolve(JSON.stringify({
                email: u.email || '',
                name: u.displayName || (u.email ? u.email.split('@')[0] : 'Shopper'),
                avatar: u.photoURL || 'https://lh3.googleusercontent.com/a/default-user',
                uid: u.uid
              }));
            })
            .catch((err) => {
              if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') {
                console.log('Google Sign-In popup dismissed by user.');
                resolve(null);
                return;
              }
              let userMsg = err.message || 'Firebase Google Sign-In failed';
              if (err.code === 'auth/operation-not-allowed') {
                userMsg = 'Please enable Google provider in Firebase Console > Authentication > Sign-in method.';
              } else if (err.code === 'auth/popup-blocked') {
                userMsg = 'Browser popup blocked. Please allow popups for localhost.';
              } else if (err.code === 'auth/unauthorized-domain') {
                userMsg = 'Domain not authorized in Firebase Console. Please open http://localhost:3000 in your browser.';
              }
              reject(userMsg);
            });
        } catch (e) {
          reject(e.toString());
        }
      });
    };

    // 2. Real Firebase Phone Auth SMS OTP
    window.sendFirebasePhoneOtp = function(phoneNumber) {
      return new Promise((resolve, reject) => {
        try {
          ensureFirebase();
          if (typeof firebase === 'undefined' || !firebase.auth) {
            reject('Firebase Auth SDK is not ready');
            return;
          }
          if (!window.recaptchaVerifier) {
            window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
              'size': 'invisible'
            });
          }
          firebase.auth().signInWithPhoneNumber(phoneNumber, window.recaptchaVerifier)
            .then((confirmationResult) => {
              window.phoneConfirmationResult = confirmationResult;
              resolve(JSON.stringify({ success: true, message: 'OTP sent to ' + phoneNumber }));
            })
            .catch((err) => {
              console.error('Firebase Phone Auth send error:', err);
              if (window.recaptchaVerifier) {
                try {
                  window.recaptchaVerifier.render().then(widgetId => grecaptcha.reset(widgetId)).catch(()=>{});
                } catch(_) {}
              }
              reject(err.message || 'Failed to send SMS OTP via Firebase');
            });
        } catch (e) {
          reject(e.toString());
        }
      });
    };

    // 3. Real Firebase Phone Auth OTP Verification
    window.verifyFirebasePhoneOtp = function(code) {
      return new Promise((resolve, reject) => {
        try {
          if (!window.phoneConfirmationResult) {
            reject('No active Firebase phone verification session found.');
            return;
          }
          window.phoneConfirmationResult.confirm(code)
            .then((res) => {
              const u = res.user;
              resolve(JSON.stringify({
                success: true,
                phone: u.phoneNumber || '',
                uid: u.uid
              }));
            })
            .catch((err) => {
              console.error('Firebase Phone Auth verify error:', err);
              reject(err.message || 'Invalid or expired OTP code');
            });
        } catch (e) {
          reject(e.toString());
        }
      });
    };

    // 4. Real Razorpay Standard Checkout Gateway Modal
    window.openRazorpayCheckout = function(optionsJson) {
      return new Promise((resolve, reject) => {
        try {
          if (typeof Razorpay === 'undefined') {
            reject('Razorpay SDK script not loaded. Please check your internet connection.');
            return;
          }
          const opts = JSON.parse(optionsJson);
          let isHandled = false;

          opts.handler = function(response) {
            isHandled = true;
            console.log('[Razorpay Checkout Success Handler]:', response);
            resolve(JSON.stringify({
              success: true,
              razorpay_payment_id: response.razorpay_payment_id || '',
              razorpay_order_id: response.razorpay_order_id || opts.order_id || '',
              razorpay_signature: response.razorpay_signature || ''
            }));
          };

          opts.modal = {
            ondismiss: function() {
              console.log('[Razorpay Modal Dismissed]');
              if (!isHandled) {
                isHandled = true;
                resolve(JSON.stringify({
                  success: false,
                  cancelled: true,
                  message: 'Payment cancelled by user'
                }));
              }
            }
          };

          const rzp = new Razorpay(opts);
          rzp.on('payment.failed', function(resp) {
            console.error('[Razorpay Payment Failed]:', resp);
            if (!isHandled) {
              isHandled = true;
              reject((resp.error && resp.error.description) ? resp.error.description : 'Payment failed');
            }
          });
          rzp.open();
        } catch (e) {
          reject(e.toString());
        }
      });
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
