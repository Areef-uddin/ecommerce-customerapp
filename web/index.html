<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="customer_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>customer_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Firebase App & Auth SDKs for Web -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <div id="recaptcha-container"></div>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAT46Y1gGr2IFdbTsoIJ3KolpsA5pHe9S4",
      authDomain: "ecommerce-auth-fcm.firebaseapp.com",
      projectId: "ecommerce-auth-fcm",
      storageBucket: "ecommerce-auth-fcm.firebasestorage.app",
      messagingSenderId: "621377508053",
      appId: "1:621377508053:android:f8125ef320004cde55085c"
    };

    function ensureFirebase() {
      if (typeof firebase !== 'undefined' && !firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
    }
    ensureFirebase();

    // 1. Google Sign-In Popup for Firebase Web
    window.signInWithGoogleFirebase = function() {
      return new Promise((resolve, reject) => {
        try {
          ensureFirebase();
          if (typeof firebase === 'undefined' || !firebase.auth) {
            reject('Firebase Auth SDK is not available yet');
            return;
          }
          const provider = new firebase.auth.GoogleAuthProvider();
          provider.addScope('email');
          provider.addScope('profile');
          firebase.auth().signInWithPopup(provider)
            .then((res) => {
              const u = res.user;
              resolve(JSON.stringify({
                email: u.email || '',
                name: u.displayName || (u.email ? u.email.split('@')[0] : 'Shopper'),
                avatar: u.photoURL || 'https://lh3.googleusercontent.com/a/default-user',
                uid: u.uid
              }));
            })
            .catch((err) => {
              console.error('Firebase Google Auth error:', err);
              reject(err.message || 'Firebase Google Sign-In canceled or failed');
            });
        } catch (e) {
          reject(e.toString());
        }
      });
    };

    // 2. Real Firebase Phone Auth SMS OTP
    window.sendFirebasePhoneOtp = function(phoneNumber) {
      return new Promise((resolve, reject) => {
        try {
          ensureFirebase();
          if (typeof firebase === 'undefined' || !firebase.auth) {
            reject('Firebase Auth SDK is not ready');
            return;
          }
          if (!window.recaptchaVerifier) {
            window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
              'size': 'invisible'
            });
          }
          firebase.auth().signInWithPhoneNumber(phoneNumber, window.recaptchaVerifier)
            .then((confirmationResult) => {
              window.phoneConfirmationResult = confirmationResult;
              resolve(JSON.stringify({ success: true, message: 'OTP sent to ' + phoneNumber }));
            })
            .catch((err) => {
              console.error('Firebase Phone Auth send error:', err);
              if (window.recaptchaVerifier) {
                try {
                  window.recaptchaVerifier.render().then(widgetId => grecaptcha.reset(widgetId)).catch(()=>{});
                } catch(_) {}
              }
              reject(err.message || 'Failed to send SMS OTP via Firebase');
            });
        } catch (e) {
          reject(e.toString());
        }
      });
    };

    // 3. Real Firebase Phone Auth OTP Verification
    window.verifyFirebasePhoneOtp = function(code) {
      return new Promise((resolve, reject) => {
        try {
          if (!window.phoneConfirmationResult) {
            reject('No active Firebase phone verification session found.');
            return;
          }
          window.phoneConfirmationResult.confirm(code)
            .then((res) => {
              const u = res.user;
              resolve(JSON.stringify({
                success: true,
                phone: u.phoneNumber || '',
                uid: u.uid
              }));
            })
            .catch((err) => {
              console.error('Firebase Phone Auth verify error:', err);
              reject(err.message || 'Invalid or expired OTP code');
            });
        } catch (e) {
          reject(e.toString());
        }
      });
    };
  </script>

  <!-- Razorpay Checkout JS -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
